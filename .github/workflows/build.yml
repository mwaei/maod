name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Restore Java source
        run: |
          mkdir -p src/main/java/com/example/baritoneui/client
          base64 -d source/BaritoneUIClient.java.gz.b64 | gzip -d > src/main/java/com/example/baritoneui/client/BaritoneUIClient.java
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: baritone-ui-mod
          path: build/libs/*.jar
